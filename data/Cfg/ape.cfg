; ape.cfg — configuration for the APE hack suite.
;
; One INI file for the whole suite; each hack owns one [Section] (ADR-0004).
; Lines beginning with ';' or '#' are comments. Read once when ape.act loads;
; editing this file takes effect on the next game launch (no hot-reload).

[CrushDepthDamage]
; APE owns 100% of crush-depth damage: it runs its own damage loop alongside
; the engine (OAE's own past-crush-depth bleed is neutralized). Three flat-rate
; bands escalate the deeper the submarine goes. The two bounded bands are each
; a window expressed as a FRACTION OF THE BOAT'S OWN CRUSH DEPTH, so thresholds
; scale per submarine class. Windows are cumulative, applied past crush depth:
;
;   light  covers [0,                              light_window)
;   medium covers [light_window,                   light_window + medium_window)
;   heavy  covers [light_window + medium_window,   +infinity)   <- open-ended
;
; Depth is measured as the fraction under crush depth:
;   fraction = (current_depth - crush_depth) / crush_depth   (clamped at 0)
; So light_window = 0.05 means "the first 5% deeper than crush depth."
; The heavy band is open-ended: past the medium edge it applies until the hull
; is gone. There is no "hand back to stock" zone and no heavy_damage_window.
;
; *_window values: fraction of crush depth (0.0 .. ~1.0). A window of 0.0
;   disables that band (the next band starts at the same point).
; *_rate values: flat hull damage in HP PER GAME-SECOND while in that band
;   (>= 0.0). Damage accrues in game-time, so it scales with time compression
;   and stops entirely while the game is paused. Tune empirically against the
;   ape.act debug log; typically light < medium < heavy.

light_damage_window  = 0.05
light_damage_rate    = 0.5

medium_damage_window = 0.10
medium_damage_rate   = 2.0

heavy_damage_rate    = 6.0
