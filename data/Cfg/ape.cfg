; ape.cfg — configuration for the APE hack suite.
;
; One INI file for the whole suite; each hack owns one [Section] (ADR-0004).
; Lines beginning with ';' or '#' are comments. Read once when ape.act loads;
; editing this file takes effect on the next game launch (no hot-reload).

[CrushDepthDamage]
; Replaces OAE's single flat past-crush-depth damage rate with three flat-rate
; bands that escalate the deeper the submarine goes. Each band is a window
; expressed as a FRACTION OF THE BOAT'S OWN CRUSH DEPTH, so thresholds scale
; per submarine class. Windows are cumulative and applied past crush depth:
;
;   light  covers [0,                     light_window)
;   medium covers [light_window,          light_window + medium_window)
;   heavy  covers [light_window+medium_window, ... + heavy_window)
;
; Depth is measured as the fraction under crush depth:
;   fraction = (current_depth - crush_depth) / crush_depth   (clamped at 0)
; So light_window = 0.05 means "the first 5% deeper than crush depth."
; Beyond the outer edge of the heavy band, APE stops intervening and OAE's
; stock terminal-damage behavior takes over unmodified.
;
; *_window values: fraction of crush depth (0.0 .. ~1.0). A window of 0.0
;   disables that band (the next band starts at the same point).
; *_rate values: flat hull damage applied per tick while in that band
;   (>= 0.0; same units as OAE's existing damage-per-tick). Tune empirically
;   against the ape.act debug log; typically light < medium < heavy.

light_damage_window  = 0.05
light_damage_rate    = 0.5

medium_damage_window = 0.10
medium_damage_rate   = 2.0

heavy_damage_window  = 0.15
heavy_damage_rate    = 6.0
